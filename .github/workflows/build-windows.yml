name: Build Windows App

# Builds a portable Windows x64 package on a windows-latest runner. The package is
# ammini.exe plus libmpv-2.dll / lua51.dll / vulkan-1.dll, which build.rs stages next
# to the executable. Runs on tag pushes (v*) and manually via workflow_dispatch, e.g.:
#   gh workflow run build-windows.yml --ref main
#   gh workflow run build-windows.yml --ref v0.2.0
# The staged folder and the build log are uploaded as run artifacts. The folder, not a
# zip, is uploaded because actions/upload-artifact always wraps its payload in a zip:
# uploading the folder makes the downloaded artifact a single zip containing the exe and
# DLLs. A versioned zip (also built here) is what gets attached to the GitHub Release on
# a tag ref.
#
# A separate "Ammini-<version>-x64-software-gl" artifact holds Mesa llvmpipe's
# opengl32.dll for machines with no OpenGL 2.0+ driver (headless VMs, CI, some RDP
# sessions). It is deliberately NOT in the main package — dropping opengl32.dll next to
# the exe overrides the real GPU driver, so it must stay opt-in. To use it, unzip the
# software-gl artifact over an extracted portable package before running.
#
# Note: tags/releases created by GITHUB_TOKEN (release-plz) do NOT trigger this
# workflow — dispatch it manually for release-plz-made tags.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write        # attach the zip to the GitHub Release

env:
  MPV_DEV_URL: https://github.com/dyphire/mpv-winbuild/releases/download/mpv_own-2026-08-31/mpv-dev-x86_64-20260831-git-02a595ddc1.7z
  MPV_DEV_SHA256: 90cafccef4894f071bdee208cae70beab352bb05de8b1d3427402846534e0122
  # Mesa llvmpipe (software OpenGL) for x64. See https://github.com/mmozeiko/build-mesa.
  MESA_URL: https://github.com/mmozeiko/build-mesa/releases/download/26.2.3/mesa-llvmpipe-x64-26.2.3.7z
  MESA_SHA256: bd0d817fbf33a7ec41aa770841eb83cc609f7c67fef7c8b56fde901a5b80a8ee

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: Provision libmpv
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\mpv-dev.7z"
          Invoke-WebRequest -Uri $env:MPV_DEV_URL -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MPV_DEV_SHA256) { throw "libmpv checksum mismatch: $hash" }
          7z x $archive -olibmpv-x64 -y
          Copy-Item libmpv-x64\libmpv.dll.a libmpv-x64\mpv.lib

      # Credentials are baked into the binary at compile time by build.rs
      # (real env wins; there is no .env on CI).
      - name: Build
        shell: pwsh
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_OTLP_URL: ${{ secrets.SENTRY_OTLP_URL }}
        run: |
          cargo build --release --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath build-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Stage a portable folder. The versioned zip is built separately (below): uploading
      # this folder, not the zip, is what avoids a zip-inside-a-zip download.
      - name: Stage portable package
        id: package
        shell: pwsh
        run: |
          $out = "target\x86_64-pc-windows-msvc\release"
          $dist = "dist\Ammini-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$out\ammini.exe" $dist
          foreach ($dll in "libmpv-2.dll","lua51.dll","vulkan-1.dll") {
            Copy-Item "$out\$dll" $dist -ErrorAction SilentlyContinue
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      # Versioned zip for the GitHub Release (and manual distribution).
      - name: Create release zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\Ammini-x64\*" -DestinationPath "dist\Ammini-${{ steps.package.outputs.version }}-x64.zip" -Force

      # Optional software-OpenGL drop-in (Mesa llvmpipe). Kept out of the portable
      # package on purpose: an opengl32.dll beside the exe takes precedence over the
      # system driver, so it is only for machines that lack a real OpenGL 2.0+ driver.
      - name: Stage software OpenGL (Mesa llvmpipe)
        id: softgl
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\mesa.7z"
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MESA_SHA256) { throw "Mesa checksum mismatch: $hash" }
          $mesa = "$env:RUNNER_TEMP\mesa"
          Remove-Item $mesa -Recurse -Force -ErrorAction SilentlyContinue
          7z x $archive "-o$mesa" -y
          # 7z extracts opengl32.dll at the archive root; find it in case the layout
          # changes between Mesa releases.
          $dll = Get-ChildItem $mesa -Recurse -Filter opengl32.dll | Select-Object -First 1
          if (-not $dll) { throw "opengl32.dll not found in the Mesa archive" }
          $dist = "dist\Ammini-software-gl"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item $dll.FullName $dist
          "path=$dist" >> $env:GITHUB_OUTPUT

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build-output.log

      # Upload the staged folder, not the zip: actions/upload-artifact always wraps its
      # payload in a zip, so uploading a zip would download as a zip-in-a-zip.
      - name: Upload portable package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ammini-${{ steps.package.outputs.version }}-x64
          path: dist/Ammini-x64/
          if-no-files-found: error

      # Optional, architecture-matched software OpenGL. Unzip over an extracted
      # portable package to run on a machine with no GPU driver.
      - name: Upload software OpenGL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ammini-${{ steps.package.outputs.version }}-x64-software-gl
          path: ${{ steps.softgl.outputs.path }}/
          if-no-files-found: error

      - name: Attach zip to GitHub Release
        if: success() && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$env:GITHUB_REF_NAME" (Get-ChildItem dist\*.zip).FullName --clobber `
            || gh release create "$env:GITHUB_REF_NAME" (Get-ChildItem dist\*.zip).FullName --title "Ammini $env:GITHUB_REF_NAME" --generate-notes

[package]
name = "ammini"
version = "0.1.8"
edition = "2024"
rust-version = "1.92"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui-sharkplayer = { version = "0.5", default-features = false }
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

statig = { version = "0.4", default-features = false, features = ["macro"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs"] }
# No TLS backend here — it is chosen per platform below. `charset`/`http2`/`system-proxy`
# are reqwest's other (non-TLS) default features, kept explicitly.
reqwest = { version = "0.13", default-features = false, features = ["stream", "charset", "http2", "system-proxy"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
chrono = "0.4"
# Startup release check: compares the published manifest version with
# CARGO_PKG_VERSION (src/update.rs).
semver = "1"
dirs = "5"
dotenvy = "0.15"
grammers-client = "0.10"
# serde feature: lets us persist PeerRef (with its access hash) in recent_telegram so
# replays work for channels, not just peers the session knows implicitly.
grammers-session = { version = "0.10", features = ["serde"] }
anyhow = "1"
bytes = "1"
tokio-stream = "0.1"
urlencoding = "2"
egui_material_icons = "0.7"
# Keeps the display awake while video plays (macOS: IOKit assertions; Windows/Linux
# have their own backends). The library API is best-effort when unsupported.
keepawake = "0.6"
# Same version egui-sharkplayer uses; unifies to the same libmpv instance so the
# vendored `PlayerState::mpv()` accessor can read/set arbitrary mpv properties.
libmpv2 = "6"
opentelemetry = { version = "0.33", default-features = false, features = ["logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["logs"] }
# reqwest-client (not hyper-client): opentelemetry-http's hyper client has no TLS
# backend, and the OTLP endpoint is https. Reuses the app's reqwest 0.13.
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["logs", "http-proto", "reqwest-client"] }
# Metrics only: events/logs go to Sentry over OTLP, but Sentry does not ingest OTLP
# metrics, so the sentry crate (native counter/gauge/distribution) is the metrics
# transport. Default integrations (panic hook, log capture) stay disabled so nothing
# is double-captured by the OTLP pipeline.
sentry = { version = "0.49", default-features = false, features = ["metrics", "transport", "reqwest", "backtrace", "contexts"] }

# Embeds the .ico and version info into the Windows exe (no-op on other targets).
[build-dependencies]
winresource = "0.1"

# TLS backend per platform. Windows uses the OS backend (Schannel via native-tls), which
# needs no C/assembly crypto build. Other platforms use rustls with the ring provider.
# (reqwest's default rustls provider, aws-lc-rs, cannot assemble its ARM64 sources on
# aarch64-pc-windows-msvc, and ring needs clang there.)
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# Vendored with a tiny patch (PlayerState::mpv accessor) so the app can switch audio
# tracks — see vendor/egui-sharkplayer. Keep the patch minimal.
[patch.crates-io]
egui-sharkplayer = { path = "vendor/egui-sharkplayer" }

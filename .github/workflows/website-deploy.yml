name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write # push the built site to the gh-pages branch

concurrency:
  group: website-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: website

      - name: Resolve latest release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Latest release tag: ${tag:-<none, download buttons will link to the releases page>}"

      - name: Build
        run: bun run build
        working-directory: website
        env:
          # GitHub Pages serves project sites under /ammini.
          SITE_BASE: /ammini
          # Exposed to the site as import.meta.env.VITE_LATEST_RELEASE_TAG;
          # drives the version badge and the per-OS download deep links.
          VITE_LATEST_RELEASE_TAG: ${{ steps.release.outputs.tag }}

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/build
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy website from ${{ github.sha }}'

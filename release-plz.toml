[workspace]
# Ammini is a binary app, never published to crates.io: versions and
# releases are tracked purely through git tags (v<version>).
publish = false
git_only = true
# Only cut a release when the release PR is merged, not on every direct
# push to main.
release_always = false
# Nothing to semver-check on a binary; skips the cargo-semver-checks
# install/run in CI.
semver_check = false

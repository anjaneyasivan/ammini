[package]
name = "ammini"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui-sharkplayer = { version = "0.5", default-features = false }
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

statig = { version = "0.4", default-features = false, features = ["macro"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs"] }
reqwest = { version = "0.13", features = ["stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
chrono = "0.4"
dirs = "5"
dotenvy = "0.15"
grammers-client = "0.10"
# serde feature: lets us persist PeerRef (with its access hash) in recent_telegram so
# replays work for channels, not just peers the session knows implicitly.
grammers-session = { version = "0.10", features = ["serde"] }
anyhow = "1"
bytes = "1"
tokio-stream = "0.1"
urlencoding = "2"
egui_material_icons = "0.7"
# Same version egui-sharkplayer uses; unifies to the same libmpv instance so the
# vendored `PlayerState::mpv()` accessor can read/set arbitrary mpv properties.
libmpv2 = "6"

# Vendored with a tiny patch (PlayerState::mpv accessor) so the app can switch audio
# tracks — see vendor/egui-sharkplayer. Keep the patch minimal.
[patch.crates-io]
egui-sharkplayer = { path = "vendor/egui-sharkplayer" }

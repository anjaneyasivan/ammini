name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-deploy.yml'
  # Re-deploy when a platform build finishes, so the download buttons switch to a
  # new release only after its binaries exist. release-plz creates the tag and the
  # Release (and dispatches the builds) *before* build-macos.yml / build-windows.yml
  # finish uploading, so `releases/latest` can name a release whose .dmg / -x64.zip
  # are still missing — the site would then publish dead download links.
  workflow_run:
    workflows: ["Build macOS App", "Build Windows App"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write # push the built site to the gh-pages branch

concurrency:
  group: website-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip workflow_run events from failed builds; the asset guard below already
    # prevents advertising an incomplete release, this just avoids a dead run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Resolve latest complete release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only advertise a release once both platform binaries are attached.
          # release-plz creates the tag + Release before build-macos.yml and
          # build-windows.yml upload the DMG/zip, so `releases/latest` may name a
          # release whose download links 404. Pick the newest published release
          # that has both assets; if none, leave the tag empty so the site falls
          # back to the releases page.
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" \
            --jq '[.[] | select(.draft == false and .prerelease == false)
                       | select([.assets[].name] | any(endswith(".dmg")))
                       | select([.assets[].name] | any(endswith("-x64.zip")))]
                  | .[0].tag_name // empty' 2>/dev/null || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Latest complete release tag: ${tag:-<none, download buttons will link to the releases page>}"

      - name: Build
        run: bun run build
        working-directory: website
        env:
          # GitHub Pages serves project sites under /ammini.
          SITE_BASE: /ammini
          # Exposed to the site as import.meta.env.VITE_LATEST_RELEASE_TAG;
          # drives the version badge and the per-OS download deep links.
          VITE_LATEST_RELEASE_TAG: ${{ steps.release.outputs.tag }}

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/build
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy website from ${{ github.sha }}'
